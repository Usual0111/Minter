<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e8ecf3">
  <meta name="description" content="Bountera. Charge your energy and build your formation.">
  <title>Bountera — Mini App</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23292c34'/%3E%3Cpath d='M36 8 17 36h14l-3 20 20-29H34z' fill='%23ff922a'/%3E%3C/svg%3E">
  <link rel="preload" as="image" href="assets/bountera-reference.jpeg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 28 28"><path d="M3 12a3 3 0 0 1 1.1-2.3l8-6.6a3 3 0 0 1 3.8 0l8 6.6A3 3 0 0 1 25 12v11a2 2 0 0 1-2 2h-5v-7a4 4 0 0 0-8 0v7H5a2 2 0 0 1-2-2Z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-tasks" viewBox="0 0 28 28"><path d="M9 5H6a2 2 0 0 0-2 2v17a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3M10 16l3 3 6-7"/><path d="M10 5a4 4 0 0 1 8 0v2h-8Z"/></symbol>
    <symbol id="i-leaders" viewBox="0 0 28 28"><path d="M7 3h14v9a7 7 0 0 1-14 0ZM7 5H2v3c0 5 3 7 6 7m13-10h5v3c0 5-3 7-6 7M14 19v7m-6 0h12"/></symbol>
    <symbol id="i-friends" viewBox="0 0 28 28"><circle cx="11" cy="8" r="5"/><path d="M1 25v-2a9 9 0 0 1 18 0v2M20 3a5 5 0 0 1 0 10m3 5a8 8 0 0 1 4 7"/></symbol>
    <symbol id="i-wallet" viewBox="0 0 28 28"><rect x="2" y="5" width="24" height="19" rx="4"/><path d="M3 11h22M6 19h6"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 28 28"><path d="M16 1 5 16h8l-2 11 12-16h-9Z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 2 3.7 6.3L22 12l-6.3 3.7L12 22l-3.7-6.3L2 12l6.3-3.7Z"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 19 19 5M6 5h13v13"/></symbol>
  </svg>

  <div class="ambient" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="phone">
    <div class="app-shell">
      <main class="content">
        <header class="header">
          <h1 class="brand" aria-label="Bountera"><span class="brand-art" aria-hidden="true"></span></h1>
          <svg class="spark" aria-hidden="true"><use href="#i-spark"/></svg>
          <button class="profile" type="button" aria-label="Bountera profile" data-action="profile"><span class="profile-art" aria-hidden="true"></span></button>
        </header>

        <button class="balance-card" type="button" data-action="wallet" aria-label="Open wallet. Balance 125.40 credits">
          <span class="balance"><span class="balance-gold">125,</span><span class="balance-decimal">40</span><span class="currency">CR</span></span>
          <span class="wallet-link">Wallet <svg aria-hidden="true"><use href="#i-arrow"/></svg></span>
        </button>

        <section class="formation" aria-labelledby="formation-title">
          <h2 id="formation-title">Formation</h2>
          <div class="reactor" role="img" aria-label="Golden Bitcoin in a metallic energy ring with six illuminated segments">
            <div class="reactor-art"></div>
            <span class="charge-flash" aria-hidden="true"></span>
          </div>
          <div class="energy-readout"><strong id="energy-value">65</strong><span> / 100 energy</span></div>
          <div class="energy-progress" role="progressbar" aria-label="Energy" aria-valuemin="0" aria-valuemax="100" aria-valuenow="65"><span id="energy-fill"></span></div>
          <p class="next-launch">Next launch: <strong>1 CR</strong></p>
          <button type="button" class="energy-button" data-action="energy">Get Energy</button>
        </section>

        <section class="daily-charge" aria-label="Daily Charge">
          <span class="daily-icon" aria-hidden="true"><svg><use href="#i-bolt"/></svg></span>
          <h2>Daily Charge</h2>
          <button type="button" class="claim-button" data-action="claim">Claim</button>
        </section>
      </main>

      <nav class="bottom-nav" aria-label="Main navigation">
        <button type="button" class="nav-item active" aria-current="page" data-tab="Home"><svg aria-hidden="true"><use href="#i-home"/></svg><span>Home</span></button>
        <button type="button" class="nav-item" data-tab="Tasks"><svg aria-hidden="true"><use href="#i-tasks"/></svg><span>Tasks</span></button>
        <button type="button" class="nav-item" data-tab="Leaders"><svg aria-hidden="true"><use href="#i-leaders"/></svg><span>Leaders</span></button>
        <button type="button" class="nav-item" data-tab="Friends"><svg aria-hidden="true"><use href="#i-friends"/></svg><span>Friends</span></button>
        <button type="button" class="nav-item" data-tab="Wallet"><svg aria-hidden="true"><use href="#i-wallet"/></svg><span>Wallet</span></button>
      </nav>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
