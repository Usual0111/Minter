<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b09">
  <meta name="description" content="Bountera — earn credits, complete tasks and manage your rewards.">
  <title>Bountera</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2388fa60'/%3E%3Cpath d='M10 7v18h8a5 5 0 000-10h-8m0-8h7a4 4 0 010 8M14 4v3m5-3v3m-5 18v3m5-3v3' fill='none' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/home.css">
  <link rel="stylesheet" href="assets/app.css">
  <link rel="stylesheet" href="assets/motion.css">
  <link rel="stylesheet" href="assets/theme.css">
  <link rel="stylesheet" href="assets/node.css">
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <linearGradient id="orange-icon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff8b24"/><stop offset="1" stop-color="#ff6500"/></linearGradient>
    <symbol id="arrow" viewBox="0 0 24 24"><path d="M5 19 19 5M6 5h13v13" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="user" viewBox="0 0 32 32"><circle cx="16" cy="9" r="7" fill="none" stroke="currentColor" stroke-width="2.3"/><path d="M3 30c.5-7.5 4-9.5 13-9.5S28.5 22.5 29 30" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/></symbol>
    <symbol id="bolt" viewBox="0 0 32 40"><path d="m18.1 2-15 21.3c-.7.9-.3 1.9.8 1.9h8.7l-.6 12.4c0 1 1.1 1.4 1.7.5L29 17.7c.7-.9.3-1.9-.8-1.9h-9L19.9 3c0-1.3-1-1.8-1.8-1Z" fill="url(#orange-icon)" stroke="#fff" stroke-width=".6"/></symbol>
    <symbol id="play" viewBox="0 0 32 32"><path d="M8 4.7c0-1.3 1.2-1.9 2.4-1.2L27 13.9c1.4.9 1.4 2.9 0 3.8L10.4 28.2c-1.2.7-2.4.1-2.4-1.2Z" fill="url(#orange-icon)" stroke="#fff" stroke-width=".8"/></symbol>
    <symbol id="partners" viewBox="0 0 36 32"><g fill="url(#orange-icon)" stroke="#fff" stroke-width=".65"><ellipse cx="18" cy="9" rx="6.2" ry="7"/><ellipse cx="7" cy="11" rx="4.4" ry="5"/><ellipse cx="29" cy="11" rx="4.4" ry="5"/><path d="M9 29H2c-1.5 0-2-1.3-1.4-4.2.6-4 2.6-6.8 6.4-6.8 2.1 0 3.5.8 4.6 2.2ZM27 29h7c1.5 0 2-1.3 1.4-4.2-.6-4-2.6-6.8-6.4-6.8-2.1 0-3.5.8-4.6 2.2Z"/><path d="M8.3 27.8c0-6.9 3.2-11 9.7-11s9.7 4.1 9.7 11c0 2.4-3.9 2.8-9.7 2.8s-9.7-.4-9.7-2.8Z"/></g></symbol>
    <symbol id="check" viewBox="0 0 32 32"><rect x="5" y="3" width="23" height="26" rx="5" fill="none" stroke="currentColor" stroke-width="2.7"/><path d="m11 15 4 4 7-8" fill="none" stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="home" viewBox="0 0 32 32"><path d="m3 13 13-11 13 11v16h-9V18h-8v11H3Z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="friends" viewBox="0 0 36 32"><g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="13" cy="8" r="6"/><circle cx="28" cy="9" r="5"/><path d="M2 30v-2c0-5.5 3.5-8 11-8s11 2.5 11 8v2m1-10c6-.5 9 2 9 7v3"/></g></symbol>
    <symbol id="wallet" viewBox="0 0 32 32"><path d="M26 5c-.6-1-1.5-1.6-3-1.6H8C4 3.4 3 5 3 8v17c0 2 1.5 3.6 4 3.6h19c2 0 3-1.5 3-3.6V12c0-2-1-3-3-3H4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="23.5" cy="18.5" r="1.8" fill="currentColor"/></symbol>
  </defs></svg>
  <main class="app" id="main-screen" data-page="home">
    <header class="topbar">
      <div class="brand" aria-label="Bountera">
        <svg class="brand-mark" viewBox="0 0 29 42" fill="none" aria-hidden="true"><g stroke="#ff8b34" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v4m7-4v4M8 35v5m7-5v5M4 35V7h13c7.2 0 11.2 8.6 6.1 13.5-2 1.9-4.7 2.5-8.1 2.5H8.8c-3.5 0-4.8 2-4.8 6v6h13c7.6 0 12-6.6 9-13"/><path d="M4 25c0-7.2 4.9-10 10.8-10H19"/></g><path d="M5 8h11c6 0 9.5 7 5.6 11.5" stroke="#ffb064" stroke-width=".7" stroke-linecap="round"/></svg>
        <span class="brand-name">Bountera</span>
      </div>
      <button class="profile" aria-label="Profile" data-route="profile"><svg aria-hidden="true"><use href="#user"/></svg></button>
    </header>
    <section class="balance" aria-label="Balance">
      <div><p class="balance-label">Your balance</p><strong class="balance-value" id="balance" aria-label="125.40 CR"><span class="balance-number-slot"><span id="balance-number">125.40</span></span><span class="balance-unit">CR</span></strong><span class="balance-reward" id="balance-reward" aria-hidden="true"></span></div>
      <button class="wallet-button" data-route="wallet">Wallet <svg aria-hidden="true"><use href="#arrow"/></svg></button>
    </section>
    <div id="home-content">
    <section class="cycle" aria-labelledby="cycle-title">
      <div class="cycle-head"><h1 id="cycle-title">Ad rewards</h1><span class="status">In progress</span></div>
      <div class="cycle-body">
        <div class="gauge" role="progressbar" aria-label="Ad bonus progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="65">
          <svg viewBox="0 0 191 191" aria-hidden="true">
            <defs>
              <linearGradient id="glass" x1=".14" y1="0" x2=".9" y2="1"><stop stop-color="#d1d3d6" stop-opacity=".46"/><stop offset=".35" stop-color="#71757b" stop-opacity=".19"/><stop offset=".7" stop-color="#95969a" stop-opacity=".05"/><stop offset="1" stop-color="#d7d2cb" stop-opacity=".24"/></linearGradient>
              <linearGradient id="glass-edge" x1=".1" y1="0" x2=".85" y2="1"><stop stop-color="#e0e2e2" stop-opacity=".7"/><stop offset=".35" stop-color="#a5a6aa" stop-opacity=".28"/><stop offset=".68" stop-color="#a5a6aa" stop-opacity=".12"/><stop offset="1" stop-color="#e8d6c5" stop-opacity=".55"/></linearGradient>
              <radialGradient id="dial" cx=".23" cy=".14" r=".9"><stop stop-color="#96999f" stop-opacity=".72"/><stop offset=".3" stop-color="#686b72" stop-opacity=".55"/><stop offset=".73" stop-color="#3e4148" stop-opacity=".2"/><stop offset="1" stop-color="#34363c" stop-opacity=".15"/></radialGradient>
              <linearGradient id="energy-gradient" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffcb73"/><stop offset=".46" stop-color="#ffab47"/><stop offset="1" stop-color="#ff7926"/></linearGradient>
              <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8"/></filter>
              <filter id="small-glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.5"/></filter>
              <mask id="active-arc-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="191" height="191"><path id="pulse-mask-path" fill="none" stroke="white" stroke-width="6.2" stroke-linecap="butt"/></mask>
              <filter id="highlight"><feGaussianBlur stdDeviation="1.3"/></filter>
            </defs>
            <circle cx="95.5" cy="95.5" r="87.5" fill="url(#glass)" stroke="url(#glass-edge)" stroke-width=".9"/>
            <circle cx="95.5" cy="95.5" r="77" fill="none" stroke="#12161d" stroke-opacity=".15" stroke-width="9"/>
            <circle cx="95.5" cy="95.5" r="74.8" fill="none" stroke="#828286" stroke-opacity=".18" stroke-width="6"/>
            <circle cx="95.5" cy="95.5" r="74.8" fill="none" stroke="#ff882e" stroke-width="19" stroke-linecap="round" stroke-dasharray="305.5 470" transform="rotate(-90 95.5 95.5)" filter="url(#glow)" opacity=".65" id="progress-glow"/>
            <circle cx="95.5" cy="95.5" r="62.8" fill="url(#dial)" stroke="url(#glass-edge)" stroke-width=".85"/>
            <path d="M54 48c7-6 16-10 27-12" fill="none" stroke="#f0f0ed" stroke-opacity=".6" stroke-width="1.8" filter="url(#highlight)"/>
            <g id="ticks" stroke="#b9babd" stroke-opacity=".3" stroke-width=".8"></g>
            <circle cx="95.5" cy="95.5" r="74.8" fill="none" stroke="#ffb759" stroke-width="8" stroke-linecap="round" stroke-dasharray="305.5 470" transform="rotate(-90 95.5 95.5)" filter="url(#small-glow)" opacity=".65"/>
            <circle id="progress" cx="95.5" cy="95.5" r="74.8" fill="none" stroke="url(#energy-gradient)" stroke-width="6.2" stroke-linecap="round" stroke-dasharray="305.5 470" transform="rotate(-90 95.5 95.5)"/>
            <circle id="progress-light" cx="95.5" cy="95.5" r="77.1" fill="none" stroke="#ffce83" stroke-opacity=".53" stroke-width=".65" stroke-linecap="round" stroke-dasharray="314.9 484.5" transform="rotate(-90 95.5 95.5)"/>
            <g id="arc-pulse" mask="url(#active-arc-mask)" fill="none" stroke="#ffdc94" stroke-width="5.5" stroke-linecap="butt"><path opacity="0"/><path opacity="0"/><path opacity="0"/><path opacity="0"/><path opacity="0"/><path opacity="0"/><path opacity="0"/><path opacity="0"/></g>
            <circle id="progress-tip" cx="35" cy="139.5" r="3.15" fill="#ffce7a"/>
          </svg>
          <div class="gauge-value"><strong class="energy-number" id="energy" data-motion-label><span class="view-number-slot"><span id="view-number">0</span></span><span id="view-target"> / 10</span></strong><span class="energy-caption">ads watched</span></div>
        </div>
        <div class="cycle-result"><p class="result-label">Next bonus</p><strong class="result-value" id="next-bonus" data-motion-label>+1 CR</strong><p class="remaining" id="remaining" data-motion-label>10 ads left</p><span id="bonus-reward" class="bonus-reward" aria-hidden="true"></span></div>
      </div>
      <p class="cycle-id"><span id="series-label" data-motion-label>Series #024</span><span id="mode-label"> · Loading…</span></p>
      <button class="energy-button" id="get-energy" data-action="start-ad">Watch ad · +0.10 CR</button>
      <p id="ad-message" class="ad-message" role="status" hidden></p>
    </section>
    <section class="daily" aria-label="Daily reward">
      <div class="icon-box"><svg aria-hidden="true"><use href="#bolt"/></svg></div>
      <div class="daily-copy"><h2 class="daily-title">Daily reward</h2><span class="daily-reward">+1.00 CR</span></div>
      <button class="claim" id="claim">Claim</button>
    </section>
    <section class="tasks" id="tasks" aria-labelledby="tasks-title">
      <div class="section-head"><h2 id="tasks-title">Earn credits</h2><button class="all-tasks" id="all-tasks">All tasks <svg aria-hidden="true"><use href="#arrow"/></svg></button></div>
      <div class="task-list">
        <article class="task"><div class="icon-box"><svg aria-hidden="true"><use href="#partners"/></svg></div><div class="task-copy"><h3 class="task-title">Partner task</h3><div class="task-detail">+35.00 CR</div></div><button class="task-action" data-task="home-partner">Open</button></article>
        <article class="task"><div class="icon-box"><svg aria-hidden="true"><use href="#check"/></svg></div><div class="task-copy"><h3 class="task-title">Daily task</h3><div class="task-detail">+15.00 CR</div></div><button class="task-action" data-task="home-daily">Start</button></article>
      </div>
    </section>
    </div>
    <div id="route-content" hidden></div>
  </main>
  <nav class="bottom-nav" aria-label="Main navigation">
    <button class="nav-item" aria-current="page" id="nav-home" data-route="home"><svg aria-hidden="true"><use href="#home"/></svg><span>Home</span></button>
    <button class="nav-item" id="nav-farm" data-route="farm"><svg aria-hidden="true"><use href="#leaf"/></svg><span>Node</span></button>
    <button class="nav-item" id="nav-tasks" data-route="tasks"><svg aria-hidden="true"><use href="#check"/></svg><span>Tasks</span></button>
    <button class="nav-item" data-route="friends"><svg aria-hidden="true"><use href="#friends"/></svg><span>Friends</span></button>
    <button class="nav-item" data-route="wallet"><svg aria-hidden="true"><use href="#wallet"/></svg><span>Wallet</span></button>
  </nav>
  <dialog class="app-dialog" id="app-dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
  <div class="toast" role="status" aria-live="polite" id="toast"></div>
  <noscript><p class="no-script">Please enable JavaScript to open Bountera.</p></noscript>
  <script src="assets/app-config.js"></script>
  <script src="assets/farm-engine.js"></script>
  <script src="assets/node-engine.js"></script>
  <script src="assets/engine.js"></script>
  <script src="assets/i18n.js"></script>
  <script src="assets/client.js"></script>
  <script src="assets/ad-provider.js"></script>
  <span id="motion-announcement" class="motion-sr-only" role="status" aria-live="polite"></span>
  <script src="assets/motion.js"></script>
  <script src="assets/motion-dom.js"></script>
  <script src="assets/node-ui.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
